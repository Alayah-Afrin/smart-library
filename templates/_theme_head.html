<script>
  // night / day mode: your saved choice, otherwise your computer's setting. Runs before the page draws.
  (function () {
    var t = null;
    try { t = localStorage.getItem('sl_theme'); } catch (e) {}
    var dark = t ? t === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
